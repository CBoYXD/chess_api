services:

  chess_api:
    container_name: "chess_api"
    build:
      context: .
      dockerfile: prod/prod.Dockerfile
    working_dir: "/usr/src/chess_api"
    ports:
      - "12345:12345"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=12345
    networks:
      - tg_bot
    volumes:
      - ".:/usr/src/chess_api"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  pg_database_chess:
    container_name: "${PG_CONTAINER_NAME}"
    image: postgres:13-alpine
    ports:
      - "5151:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: "postgres -c max_connections=150
             -c shared_buffers=512MB -c effective_cache_size=1536MB
             -c maintenance_work_mem=128MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB
             -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200
             -c work_mem=3495kB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=2
             -c max_parallel_workers_per_gather=1 -c max_parallel_workers=2 -c max_parallel_maintenance_workers=1"
    env_file:
      - '.env'
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    networks:
      - tg_bot

  redis_cache:
    image: redis:6.2-alpine
    container_name: "${REDIS_CONTAINER_NAME}"
    restart: always
    command: redis-server --port $REDIS_PORT --save 20 1 --loglevel warning --requirepass $REDIS_PASSWORD
    env_file:
      - ".env"
    volumes:
      - ./cache:/data
    networks:
      - tg_bot
    
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"


  reverse-proxy:
    image: nginx
    container_name: nginx-reverse-proxy
    stop_signal: SIGINT
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - chess_api
    networks:
      - tg_bot
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt/:/etc/letsencrypt/:rw
      - /var/certbot/www/:/var/www/certbot/:rw




networks:
  tg_bot:
    driver: bridge

volumes:
  pgdata: { }
